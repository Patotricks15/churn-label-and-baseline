[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-label-and-baseline"
version = "0.1.0"
description = "Churn labelling and baseline models (CH01) on Online Retail II."
requires-python = ">=3.11"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
